<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Highway Enforcer - Turbo Racer</title>
    <style>
        /* Base & Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #020205;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Game Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 600px;
            max-height: 900px;
            background: #111;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.25), 0 0 100px rgba(255, 0, 85, 0.15);
            overflow: hidden;
            border: 2px solid rgba(0, 240, 255, 0.4);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI Overlay Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            background: rgba(10, 15, 25, 0.85);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .hud-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hud-label {
            font-size: 10px;
            letter-spacing: 1.5px;
            color: #88aaff;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .hud-val {
            font-size: 20px;
            font-weight: 800;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.8);
        }

        .hud-bottom {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 60px;
        }

        .health-container {
            width: 100%;
            max-width: 250px;
        }

        .health-bar-bg {
            width: 100%;
            height: 14px;
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid rgba(255, 51, 102, 0.6);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.3);
        }

        #health-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff0055, #00ffcc);
            transition: width 0.2s ease-out;
            box-shadow: 0 0 10px #00ffcc;
        }

        .active-powerups {
            display: flex;
            gap: 8px;
        }

        .powerup-badge {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 5px 10px;
            border-radius: 6px;
            background: rgba(0, 255, 200, 0.15);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 200, 0.4);
            animation: pulse 1s infinite alternate;
        }

        /* Modals & Overlay Screens */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 4, 12, 0.88);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .overlay-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .game-title {
            font-size: 38px;
            font-weight: 900;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 15px #00f0ff, 0 0 30px #00f0ff, 0 0 60px #00f0ff;
            letter-spacing: 3px;
            margin-bottom: 8px;
            line-height: 1.1;
        }

        .glow-red {
            text-shadow: 0 0 15px #ff0055, 0 0 30px #ff0055, 0 0 60px #ff0055;
        }

        .game-subtitle {
            font-size: 13px;
            color: #88aaff;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        .controls-guide {
            background: rgba(255, 255, 255, 0.04);
            padding: 14px 24px;
            border-radius: 10px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            margin-bottom: 30px;
            text-align: center;
            font-size: 13px;
            color: #ccc;
            line-height: 1.6;
        }

        .controls-guide span {
            color: #00ffcc;
            font-weight: bold;
        }

        .final-stats {
            font-size: 18px;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.8;
            color: #aaa;
        }

        .final-stats span {
            color: #00f0ff;
            font-weight: bold;
            font-size: 22px;
        }

        /* Buttons */
        .arcade-btn {
            background: linear-gradient(180deg, #00f0ff, #0066ff);
            border: none;
            color: #000;
            font-weight: 800;
            font-size: 16px;
            letter-spacing: 1px;
            padding: 14px 36px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .arcade-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.9);
        }

        .arcade-btn:active {
            transform: scale(0.95);
        }

        .arcade-btn.secondary {
            background: linear-gradient(180deg, #444, #111);
            color: #fff;
            box-shadow: none;
            border: 1px solid #555;
        }

        #pause-toggle-btn {
            position: absolute;
            top: 65px;
            right: 15px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(10, 15, 30, 0.7);
            border: 1px solid rgba(0, 240, 255, 0.4);
            color: #00f0ff;
            font-size: 16px;
            cursor: pointer;
            z-index: 5;
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }

        /* Mobile Controls */
        #mobile-controls {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 10px;
            z-index: 5;
            pointer-events: auto;
        }

        .touch-btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: rgba(0, 240, 255, 0.12);
            border: 2px solid rgba(0, 240, 255, 0.4);
            color: #00f0ff;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
            touch-action: manipulation;
        }

        .touch-btn.action {
            width: 75px;
            height: 75px;
            background: rgba(255, 0, 85, 0.2);
            border-color: rgba(255, 0, 85, 0.6);
            color: #ff0055;
        }

        .touch-btn:active {
            background: rgba(0, 240, 255, 0.35);
            transform: scale(0.92);
        }

        @media (min-width: 768px) {
            #mobile-controls { display: none; }
            .hud-bottom { margin-bottom: 0; }
        }

        @keyframes pulse {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div class="hud-top">
                <div class="hud-box">
                    <span class="hud-label">SCORE</span>
                    <span id="score-val" class="hud-val">0</span>
                </div>
                <div class="hud-box">
                    <span class="hud-label">HIGH SCORE</span>
                    <span id="highscore-val" class="hud-val">0</span>
                </div>
                <div class="hud-box">
                    <span class="hud-label">LEVEL</span>
                    <span id="level-val" class="hud-val">1</span>
                </div>
            </div>

            <div class="hud-bottom">
                <div class="health-container">
                    <span class="hud-label">ARMOR HEALTH</span>
                    <div class="health-bar-bg">
                        <div id="health-bar-fill"></div>
                    </div>
                </div>
                <div class="active-powerups" id="powerup-icons"></div>
            </div>
        </div>

        <div id="start-screen" class="overlay-screen active">
            <h1 class="game-title">HIGHWAY<br>ENFORCER</h1>
            <p class="game-subtitle">CLEAR THE HIGHWAY OF INCOMING TRAFFIC</p>
            
            <div class="controls-guide">
                <p>Change Lanes: <span>A / D</span> or <span>&larr; / &rarr;</span></p>
                <p>Fire Blaster: <span>Spacebar</span></p>
            </div>

            <button id="start-btn" class="arcade-btn">START RACE</button>
        </div>

        <div id="pause-screen" class="overlay-screen hidden">
            <h2 class="game-title">GAME PAUSED</h2>
            <button id="resume-btn" class="arcade-btn">RESUME</button>
            <button id="pause-restart-btn" class="arcade-btn secondary">RESTART</button>
        </div>

        <div id="gameover-screen" class="overlay-screen hidden">
            <h1 class="game-title glow-red">TOTAL CRASH</h1>
            <div class="final-stats">
                <p>FINAL SCORE<br><span id="final-score">0</span></p>
                <br>
                <p>LEVEL REACHED<br><span id="final-level">1</span></p>
            </div>
            <button id="restart-btn" class="arcade-btn">TRY AGAIN</button>
        </div>

        <button id="pause-toggle-btn" class="hud-btn hidden">⏸</button>

        <div id="mobile-controls">
            <button id="btn-left" class="touch-btn">&larr;</button>
            <button id="btn-shoot" class="touch-btn action">FIRE</button>
            <button id="btn-right" class="touch-btn">&rarr;</button>
        </div>
    </div>

    <script>
        // --- Canvas & Core Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            const container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // --- Sound Generator (Web Audio API) ---
        class SoundSystem {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            playShoot() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            }
            playExplosion(isBig = false) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const dur = isBig ? 0.45 : 0.25;
                osc.type = 'square';
                osc.frequency.setValueAtTime(isBig ? 120 : 180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + dur);
                gain.gain.setValueAtTime(isBig ? 0.5 : 0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + dur);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + dur);
            }
            playPowerup() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(950, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.2);
            }
            playGameOver() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 1.0);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 1.0);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 1.0);
            }
        }
        const sounds = new SoundSystem();

        // --- Game State & Variables ---
        const STATE = { START: 'START', PLAYING: 'PLAYING', PAUSED: 'PAUSED', GAMEOVER: 'GAMEOVER' };
        let currentState = STATE.START;
        let score = 0;
        let highScore = localStorage.getItem('he_highscore') || 0;
        let level = 1;
        let lastTime = 0;
        let spawnTimer = 0;
        let screenShake = 0;
        let roadOffset = 0;

        document.getElementById('highscore-val').textContent = highScore;

        function triggerShake(amount) { screenShake = Math.max(screenShake, amount); }

        // --- Input Engine ---
        const keys = { left: false, right: false, shoot: false };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = true;
            if (e.key === ' ' || e.key === 'Spacebar') {
                keys.shoot = true;
                if (currentState === STATE.PLAYING) e.preventDefault();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.right = false;
            if (e.key === ' ' || e.key === 'Spacebar') keys.shoot = false;
        });

        const bindTouch = (id, key) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        };
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-shoot', 'shoot');

        // --- Highway & Lane Engine ---
        const NUM_LANES = 4;
        function getLaneWidth() { return canvas.width / NUM_LANES; }
        function getLaneX(laneIndex) {
            const lw = getLaneWidth();
            return laneIndex * lw + lw / 2;
        }

        function drawHighway(dt) {
            roadOffset = (roadOffset + (250 + level * 30) * dt) % 60;

            // Dark Asphalt Base
            ctx.fillStyle = '#181820';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Side Guardrails
            ctx.fillStyle = '#ffaa00';
            ctx.fillRect(0, 0, 8, canvas.height);
            ctx.fillRect(canvas.width - 8, 0, 8, canvas.height);

            // Lane Divider Dashed Lines
            const lw = getLaneWidth();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 4;
            ctx.setLineDash([30, 30]);
            ctx.lineDashOffset = -roadOffset;

            for (let i = 1; i < NUM_LANES; i++) {
                ctx.beginPath();
                ctx.moveTo(i * lw, 0);
                ctx.lineTo(i * lw, canvas.height);
                ctx.stroke();
            }
            ctx.setLineDash([]); // Reset dash line
        }

        // --- Particles & Visual Effects ---
        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.color = color;
                this.radius = Math.random() * 3 + 1.5;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 9 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.015;
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                this.vx *= 0.95; this.vy *= 0.95;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Shockwave {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.color = color;
                this.radius = 5;
                this.maxRadius = Math.random() * 30 + 35;
                this.alpha = 1;
            }
            update() {
                this.radius += (this.maxRadius - this.radius) * 0.2;
                this.alpha -= 0.04;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }
        }

        class FloatingText {
            constructor(x, y, text, color = '#00f0ff') {
                this.x = x; this.y = y;
                this.text = text; this.color = color;
                this.alpha = 1; this.vy = -1.5;
            }
            update() {
                this.y += this.vy;
                this.alpha -= 0.025;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.font = 'bold 16px "Segoe UI", sans-serif';
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        let particles = [];
        let shockwaves = [];
        let floatTexts = [];

        function createExplosion(x, y, color, isBig = false) {
            const count = isBig ? 35 : 20;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
            shockwaves.push(new Shockwave(x, y, color));
            triggerShake(isBig ? 12 : 6);
            sounds.playExplosion(isBig);
        }

        // Tire Smoke Effects
        class TireSmoke {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.radius = Math.random() * 4 + 2;
                this.alpha = 0.6;
            }
            update() {
                this.y += 3;
                this.radius += 0.3;
                this.alpha -= 0.03;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = '#888';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        let tireSmokes = [];

        // --- Player Sports Car ---
        class PlayerCar {
            constructor() {
                this.width = 38;
                this.height = 70;
                this.x = canvas.width / 2 - this.width / 2;
                this.y = canvas.height - 110;
                this.speed = 380;
                this.maxHealth = 100;
                this.health = 100;
                this.shootCooldown = 0;

                this.rapidFireTimer = 0;
                this.shieldTimer = 0;
                this.doubleScoreTimer = 0;
                this.shieldAngle = 0;
            }

            update(dt) {
                if (keys.left) this.x -= this.speed * dt;
                if (keys.right) this.x += this.speed * dt;

                this.x = Math.max(10, Math.min(canvas.width - this.width - 10, this.x));

                // Tire trail smoke
                if (Math.random() < 0.4) {
                    tireSmokes.push(new TireSmoke(this.x + 6, this.y + this.height - 5));
                    tireSmokes.push(new TireSmoke(this.x + this.width - 6, this.y + this.height - 5));
                }

                if (this.shootCooldown > 0) this.shootCooldown -= dt;
                if (this.rapidFireTimer > 0) this.rapidFireTimer -= dt;
                if (this.shieldTimer > 0) this.shieldTimer -= dt;
                if (this.doubleScoreTimer > 0) this.doubleScoreTimer -= dt;

                this.shieldAngle += dt * 3;

                const cooldownRate = this.rapidFireTimer > 0 ? 0.09 : 0.20;
                if (keys.shoot && this.shootCooldown <= 0) {
                    bullets.push(new Bullet(this.x + 8, this.y));
                    bullets.push(new Bullet(this.x + this.width - 8, this.y));
                    sounds.playShoot();
                    this.shootCooldown = cooldownRate;
                }

                this.updateUI();
            }

            takeDamage(amount) {
                if (this.shieldTimer > 0) return;
                this.health -= amount;
                triggerShake(8);
                if (this.health <= 0) {
                    this.health = 0;
                    gameOver();
                }
            }

            updateUI() {
                const fill = document.getElementById('health-bar-fill');
                const pct = (this.health / this.maxHealth) * 100;
                fill.style.width = `${pct}%`;

                const container = document.getElementById('powerup-icons');
                container.innerHTML = '';
                if (this.rapidFireTimer > 0) container.innerHTML += `<span class="powerup-badge">TURBO CANNON</span>`;
                if (this.shieldTimer > 0) container.innerHTML += `<span class="powerup-badge">ENERGY SHIELD</span>`;
                if (this.doubleScoreTimer > 0) container.innerHTML += `<span class="powerup-badge">2X MULTIPLIER</span>`;
            }

            draw() {
                ctx.save();
                
                // Shield Dome
                if (this.shieldTimer > 0) {
                    ctx.save();
                    ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                    ctx.rotate(this.shieldAngle);
                    ctx.strokeStyle = '#00f0ff';
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#00f0ff';
                    ctx.beginPath();
                    ctx.arc(0, 0, 45, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(0, 240, 255, 0.15)';
                    ctx.fill();
                    ctx.restore();
                }

                // Sports Car Chassis
                ctx.fillStyle = '#00f0ff';
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#00f0ff';

                // Main body
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 8);
                ctx.fill();

                // Wheels
                ctx.fillStyle = '#111';
                ctx.fillRect(this.x - 3, this.y + 8, 4, 14);
                ctx.fillRect(this.x + this.width - 1, this.y + 8, 4, 14);
                ctx.fillRect(this.x - 3, this.y + this.height - 22, 4, 14);
                ctx.fillRect(this.x + this.width - 1, this.y + this.height - 22, 4, 14);

                // Windshield / Roof
                ctx.fillStyle = '#051525';
                ctx.beginPath();
                ctx.roundRect(this.x + 5, this.y + 18, this.width - 10, 28, 4);
                ctx.fill();

                // Headlights
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 10; ctx.shadowColor = '#ffffff';
                ctx.fillRect(this.x + 4, this.y + 2, 8, 4);
                ctx.fillRect(this.x + this.width - 12, this.y + 2, 8, 4);

                // Brake Lights
                ctx.fillStyle = '#ff0055';
                ctx.shadowColor = '#ff0055';
                ctx.fillRect(this.x + 4, this.y + this.height - 4, 8, 3);
                ctx.fillRect(this.x + this.width - 12, this.y + this.height - 4, 8, 3);

                ctx.restore();
            }
        }
        let player;

        // --- Cannon Laser Bullets ---
        class Bullet {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.width = 4; this.height = 16;
                this.speed = 750;
            }
            update(dt) { this.y -= this.speed * dt; }
            draw() {
                ctx.save();
                ctx.fillStyle = '#ff0055';
                ctx.shadowBlur = 10; ctx.shadowColor = '#ff0055';
                ctx.fillRect(this.x - this.width / 2, this.y, this.width, this.height);
                
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(this.x - this.width / 4, this.y + 2, this.width / 2, this.height - 4);
                ctx.restore();
            }
        }
        let bullets = [];

        // --- Opposite Lane Enemy Cars ---
        class EnemyCar {
            constructor(laneIndex, type) {
                this.lane = laneIndex;
                this.type = type; // 1: Coupe, 2: SUV/Sedan, 3: Heavy Truck
                
                if (type === 1) { // Fast Sports Coupe
                    this.width = 36; this.height = 65; this.speed = 220; this.maxHp = 1; this.hp = 1; this.color = '#ffaa00'; this.scoreVal = 100;
                } else if (type === 2) { // Medium SUV
                    this.width = 40; this.height = 75; this.speed = 150; this.maxHp = 3; this.hp = 3; this.color = '#ff0055'; this.scoreVal = 250;
                } else { // Heavy Armored Truck
                    this.width = 48; this.height = 95; this.speed = 90; this.maxHp = 7; this.hp = 7; this.color = '#aa00ff'; this.scoreVal = 500;
                }

                this.x = getLaneX(laneIndex) - this.width / 2;
                this.y = -this.height - 20;
            }

            update(dt) {
                this.y += (this.speed + level * 15) * dt;
            }

            draw() {
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10; ctx.shadowColor = this.color;

                // Car Chassis
                ctx.beginPath();
                ctx.roundRect(this.x, this.y, this.width, this.height, 6);
                ctx.fill();

                // Opposite Headlights (Facing Downwards)
                ctx.fillStyle = '#ffffaa';
                ctx.shadowColor = '#ffffaa';
                ctx.fillRect(this.x + 4, this.y + this.height - 5, 8, 4);
                ctx.fillRect(this.x + this.width - 12, this.y + this.height - 5, 8, 4);

                // Windshield
                ctx.fillStyle = '#111';
                ctx.fillRect(this.x + 4, this.y + 15, this.width - 8, 20);

                // Truck Overhead Health Bar
                if (this.type === 3) {
                    const hpPct = this.hp / this.maxHp;
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.fillRect(this.x, this.y - 10, this.width, 5);
                    ctx.fillStyle = '#00ffcc';
                    ctx.fillRect(this.x, this.y - 10, this.width * hpPct, 5);
                }

                ctx.restore();
            }
        }
        let enemies = [];

        // --- PowerUp Items ---
        class PowerUp {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.size = 24; this.speed = 120;
                const types = ['RAPID', 'SHIELD', 'DOUBLE'];
                this.type = types[Math.floor(Math.random() * types.length)];
                this.pulse = 0;
            }

            update(dt) {
                this.y += this.speed * dt;
                this.pulse += dt * 5;
            }

            draw() {
                ctx.save();
                const scale = 1 + Math.sin(this.pulse) * 0.15;
                ctx.translate(this.x, this.y);
                ctx.scale(scale, scale);

                let color = '#00f0ff', label = 'S';
                if (this.type === 'RAPID') { color = '#ffcc00'; label = 'R'; }
                if (this.type === 'DOUBLE') { color = '#00ffcc'; label = '2X'; }

                ctx.fillStyle = color;
                ctx.shadowBlur = 12; ctx.shadowColor = color;
                ctx.beginPath();
                ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#000';
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(label, 0, 0);
                ctx.restore();
            }
        }
        let powerups = [];

        // --- Spawn Manager ---
        function spawnManager(dt) {
            spawnTimer += dt;
            const spawnRate = Math.max(0.4, 1.6 - (level * 0.12));

            if (spawnTimer >= spawnRate) {
                spawnTimer = 0;
                const randomLane = Math.floor(Math.random() * NUM_LANES);

                let type = 1;
                const rand = Math.random();
                if (level >= 2 && rand > 0.45) type = 2;
                if (level >= 3 && rand > 0.75) type = 3;

                enemies.push(new EnemyCar(randomLane, type));
            }
        }

        // --- Collisions & Physics ---
        function checkCollisions() {
            // Bullets vs Enemy Cars
            for (let bIndex = bullets.length - 1; bIndex >= 0; bIndex--) {
                for (let eIndex = enemies.length - 1; eIndex >= 0; eIndex--) {
                    const b = bullets[bIndex];
                    const e = enemies[eIndex];

                    if (b && e &&
                        b.x > e.x && b.x < e.x + e.width &&
                        b.y > e.y && b.y < e.y + e.height) {
                        
                        bullets.splice(bIndex, 1);
                        e.hp--;
                        particles.push(new Particle(b.x, b.y, '#ffaa00'));

                        if (e.hp <= 0) {
                            const isBig = e.type === 3;
                            createExplosion(e.x + e.width / 2, e.y + e.height / 2, e.color, isBig);
                            
                            const points = player.doubleScoreTimer > 0 ? e.scoreVal * 2 : e.scoreVal;
                            score += points;
                            document.getElementById('score-val').textContent = score;

                            floatTexts.push(new FloatingText(e.x + e.width / 2, e.y, `+${points}`, e.color));

                            if (Math.random() < 0.2) {
                                powerups.push(new PowerUp(e.x + e.width / 2, e.y + e.height / 2));
                            }

                            enemies.splice(eIndex, 1);
                            checkLevelProgression();
                        }
                        break;
                    }
                }
            }

            // Player vs Enemy Car Crash
            for (let eIndex = enemies.length - 1; eIndex >= 0; eIndex--) {
                const e = enemies[eIndex];

                if (e.x < player.x + player.width &&
                    e.x + e.width > player.x &&
                    e.y < player.y + player.height &&
                    e.y + e.height > player.y) {
                    
                    createExplosion(e.x + e.width / 2, e.y + e.height / 2, '#ff0055', true);
                    player.takeDamage(25);
                    enemies.splice(eIndex, 1);
                    continue;
                }

                // Passed By Unscathed
                if (e.y > canvas.height) {
                    enemies.splice(eIndex, 1);
                }
            }

            // Powerups vs Player
            for (let pIndex = powerups.length - 1; pIndex >= 0; pIndex--) {
                const p = powerups[pIndex];
                if (p.x > player.x && p.x < player.x + player.width &&
                    p.y > player.y && p.y < player.y + player.height) {
                    
                    sounds.playPowerup();
                    if (p.type === 'RAPID') player.rapidFireTimer = 8;
                    if (p.type === 'SHIELD') player.shieldTimer = 7;
                    if (p.type === 'DOUBLE') player.doubleScoreTimer = 10;

                    floatTexts.push(new FloatingText(player.x, player.y, `${p.type} ACTIVATED!`, '#00f0ff'));
                    powerups.splice(pIndex, 1);
                } else if (p.y > canvas.height) {
                    powerups.splice(pIndex, 1);
                }
            }
        }

        function checkLevelProgression() {
            const nextLevel = Math.floor(score / 1500) + 1;
            if (nextLevel > level) {
                level = nextLevel;
                document.getElementById('level-val').textContent = level;
                floatTexts.push(new FloatingText(canvas.width / 2 - 40, canvas.height / 2, `LEVEL ${level}!`, '#00f0ff'));
            }
        }

        // --- Game Render Loop ---
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            ctx.save();
            if (screenShake > 0) {
                const shakeX = (Math.random() - 0.5) * screenShake;
                const shakeY = (Math.random() - 0.5) * screenShake;
                ctx.translate(shakeX, shakeY);
                screenShake *= 0.9;
                if (screenShake < 0.3) screenShake = 0;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Highway Road Background
            drawHighway(dt);

            if (currentState === STATE.PLAYING) {
                player.update(dt);
                bullets.forEach(b => b.update(dt));
                enemies.forEach(e => e.update(dt));
                powerups.forEach(p => p.update(dt));
                particles.forEach(p => p.update());
                shockwaves.forEach(sw => sw.update());
                tireSmokes.forEach(ts => ts.update());
                floatTexts.forEach(ft => ft.update());

                bullets = bullets.filter(b => b.y > -20);
                particles = particles.filter(p => p.alpha > 0);
                shockwaves = shockwaves.filter(sw => sw.alpha > 0);
                tireSmokes = tireSmokes.filter(ts => ts.alpha > 0);
                floatTexts = floatTexts.filter(ft => ft.alpha > 0);

                spawnManager(dt);
                checkCollisions();

                tireSmokes.forEach(ts => ts.draw());
                player.draw();
                bullets.forEach(b => b.draw());
                enemies.forEach(e => e.draw());
                powerups.forEach(p => p.draw());
                particles.forEach(p => p.draw());
                shockwaves.forEach(sw => sw.draw());
                floatTexts.forEach(ft => ft.draw());
            }

            ctx.restore();
            requestAnimationFrame(gameLoop);
        }

        // --- Flow State Controllers ---
        function initGame() {
            sounds.init();
            score = 0;
            level = 1;
            bullets = [];
            enemies = [];
            powerups = [];
            particles = [];
            shockwaves = [];
            tireSmokes = [];
            floatTexts = [];
            player = new PlayerCar();

            document.getElementById('score-val').textContent = score;
            document.getElementById('level-val').textContent = level;
            
            showScreen(null);
            document.getElementById('pause-toggle-btn').classList.remove('hidden');
            currentState = STATE.PLAYING;
        }

        function gameOver() {
            currentState = STATE.GAMEOVER;
            sounds.playGameOver();

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('he_highscore', highScore);
                document.getElementById('highscore-val').textContent = highScore;
            }

            document.getElementById('final-score').textContent = score;
            document.getElementById('final-level').textContent = level;
            document.getElementById('pause-toggle-btn').classList.add('hidden');
            showScreen('gameover-screen');
        }

        function showScreen(id) {
            document.querySelectorAll('.overlay-screen').forEach(s => {
                s.classList.remove('active');
                s.classList.add('hidden');
            });
            if (id) {
                const screen = document.getElementById(id);
                screen.classList.remove('hidden');
                screen.classList.add('active');
            }
        }

        // Listeners
        document.getElementById('start-btn').addEventListener('click', initGame);
        document.getElementById('restart-btn').addEventListener('click', initGame);
        document.getElementById('pause-restart-btn').addEventListener('click', initGame);

        document.getElementById('pause-toggle-btn').addEventListener('click', () => {
            if (currentState === STATE.PLAYING) {
                currentState = STATE.PAUSED;
                showScreen('pause-screen');
            }
        });

        document.getElementById('resume-btn').addEventListener('click', () => {
            if (currentState === STATE.PAUSED) {
                showScreen(null);
                currentState = STATE.PLAYING;
            }
        });

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
